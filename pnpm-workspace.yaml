packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.129'
  - ai@7.0.156

nodeLinker: hoisted

patchedDependencies:
  '@better-auth/electron@1.7.14': patches/better-auth-electron-1.7.14.patch
